name: Build and Deploy with MicroK8s

on:
  # workflow_dispatch:
  #   inputs:
  #     image_tag:
  #       description: 'Tag de la imagen (ej: v1.0.0, latest)'
  #       required: true
  #       default: 'latest'
  push:
    branches: [dev]

jobs:
  build-and-publish:
    name: Build and Push Image to GHCR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: Mostrar rama actual
      run: "echo 'Rama actual: ${{ github.ref }}'"

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Docker image
      run: docker build -t ghcr.io/${{ github.repository_owner }}/MS-Authentication:latest .

    - name: Push Docker image
      run: docker push ghcr.io/${{ github.repository_owner }}/MS-Authentication:latest

    - name: Print pushed image URL
      run: 'echo "Imagen publicada: ghcr.io/${{ github.repository_owner }}/MS-Authentication:latest"'

  
