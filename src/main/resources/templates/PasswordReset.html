<!DOCTYPE html>
        <html lang="es">
        <head>
            <meta charset="UTF-8">
            <title>Recuperación de Contraseña</title>
        </head>
        <body style="background:#f5f5f5;">
            <div style="max-width:400px;margin:40px auto;padding:30px;background:#e8f5e9;
                        border:2px solid #4CAF50;border-radius:8px;text-align:center;box-shadow:0 2px 8px #0001;">
                <h2>Recuperación de Contraseña</h2>
                <p style="font-family:'Segoe UI', 'Roboto', Arial, sans-serif; font-size:16px; color:#333;">
                    Usa el siguiente código para restablecer tu contraseña:
                </p>
                <div style="font-size:24px;font-weight:bold;color:#4CAF50;margin:20px 0;">
                    <span th:text="${otp}">123456</span>
                </div>
                <p style="font-family:'Segoe UI', 'Roboto', Arial, sans-serif; font-size:16px; color:#333;">
                    Si no solicitaste este cambio, puedes ignorar este mensaje.
                </p>
            </div>
        </body>
        </html>
