<!DOCTYPE html>
           <html lang="es">
           <head>
               <meta charset="UTF-8">
               <title>Verificación de Correo</title>
           </head>
           <body style="background:#f5f5f5;">
               <div style="max-width:400px;margin:40px auto;padding:30px;background:#e8f5e9;
                           border:2px solid #000;border-radius:8px;text-align:center;box-shadow:0 2px 8px #0001;">
                   <h2>Bienvenido a Firsteps!</h2>
                   <p style="font-family:'Segoe UI', 'Roboto', Arial, sans-serif; font-size:16px; color:#333;">
                       Ingresa al siguiente enlace para activar tu cuenta:
                   </p>
                   <a href="${validationLink}"
                      style="display:inline-block;padding:10px 20px;background:#4CAF50;color:#fff;
                      text-decoration:none;border-radius:5px;margin:16px 0;">Verificar Correo</a>
                   <p style="font-family:'Segoe UI', 'Roboto', Arial, sans-serif; font-size:16px; color:#333;">
                       Si no realizaste registro en nuestra página por favor ignora este mensaje
                   </p>
               </div>
